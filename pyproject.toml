[project]
name = "gcp-vertex-ai-agent"
version = "0.1.0"
description = "Portfolio demo: a Vertex AI Gemini agent with Firestore catalog tools on Cloud Run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arpan Bom", email = "applycoding@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "google-genai>=2.0",
  "google-cloud-firestore>=2.19",
  "google-cloud-logging>=3.11",
  "google-cloud-secret-manager>=2.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
